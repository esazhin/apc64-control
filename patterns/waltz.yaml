# Waltz: two bars of 3/4, the bass on beat 1 (string 6, then string 5), then strings 3, 2 and 1 together on beats
# 2 and 3, rolled gently from low to high.
name: Waltz 3/4
meter: 3/4
step: 1/4
length: 6
lanes:
  1: . x x | . x x
  2: . x x | . x x
  3: . x x | . x x
  5: . . . | X . .        # bar 2: the bass on string 5
  6: X . . | . . .        # bar 1: the bass on string 6
strum: . d d | . d d      # d: low to high strings, spread apart
spread: 8                 # milliseconds between strings
